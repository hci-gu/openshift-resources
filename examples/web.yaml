# Static website with a Service and public HTTPS Route.
# Build public frontend configuration into the image; use an OpenShift-compatible
# Nginx setup listening on 8080. Runtime pod env does not rewrite Vite bundles.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example-web
  template:
    metadata:
      labels:
        app: example-web
    spec:
      containers:
        - name: web
          image: example.invalid/team/example-web:REPLACE_ME
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: example-web
spec:
  selector:
    app: example-web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: example-web
  # Enable only if supported by the target cluster:
  # annotations:
  #   kubernetes.io/tls-acme: "true"
spec:
  host: example-web.example.invalid
  to:
    kind: Service
    name: example-web
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
